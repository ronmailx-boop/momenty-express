<!doctype html>
<html lang="he" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url(assets/fonts/heebo-hebrew-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Heebo"; font-weight: 800; src: url(assets/fonts/heebo-hebrew-800-normal.woff2) format("woff2"); }
      :root { --ink: #f8f5ef; --gold: #ffc45e; --gold2: #ff8a3d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05060f; }
      #root { width: 100%; height: 100%; position: relative; font-family: "Heebo", sans-serif; color: var(--ink); overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      #sky-night { background: radial-gradient(120% 70% at 50% 100%, #1b2350 0%, #0b0f2a 45%, #04050d 100%); }
      #sky-dawn { opacity: 0; background: linear-gradient(180deg, #1a2257 0%, #4b3a78 38%, #c4607a 62%, #ff9a52 82%, #ffd08a 100%); }
      #sky-sun { opacity: 0; background: linear-gradient(180deg, #2c4a8a 0%, #8a6aa8 30%, #ff9e6a 60%, #ffd27f 85%, #fff0c2 100%); }
      .star { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff; }
      #stars { transform-origin: 50% 120%; }
      #sun { position: absolute; left: 50%; top: 1500px; width: 520px; height: 520px; margin-left: -260px; border-radius: 50%;
             background: radial-gradient(circle, #fff6d8 0%, #ffd27a 35%, #ff9d47 60%, rgba(255,140,60,0) 72%); filter: blur(2px); }
      #rays { position: absolute; left: 50%; top: 1760px; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; opacity: 0;
              background: repeating-conic-gradient(from 0deg, rgba(255,226,160,.16) 0deg 6deg, rgba(255,226,160,0) 6deg 18deg);
              -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%); mask-image: radial-gradient(circle, #000 0%, transparent 60%); }
      #horizon { position: absolute; left: 0; right: 0; top: 1500px; height: 420px;
                 background: linear-gradient(180deg, rgba(10,8,24,0) 0%, #090716 40%, #05040c 100%); }
      #hills { position: absolute; left: -40px; right: -40px; top: 1440px; height: 520px; }
      .ember { position: absolute; top: 0; border-radius: 50%; background: radial-gradient(circle, #ffe3a3 0%, #ffad4d 50%, rgba(255,140,50,0) 75%); opacity: 0; }
      #vignette { background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }
      .scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 56px 360px; }
      .inner { display: flex; flex-direction: column; align-items: center; gap: 34px; text-align: center; }
      .line { font-size: 70px; font-weight: 400; line-height: 1.2; text-shadow: 0 4px 30px rgba(0,0,0,.55); }
      .line.soft { font-size: 62px; opacity: .82; }
      .line.big { font-size: 94px; font-weight: 800; line-height: 1.1; }
      .line.huge { font-size: 140px; font-weight: 800; line-height: 1.05; }
      .w { display: inline-block; }
      .gold { color: var(--gold); text-shadow: 0 0 40px rgba(255,170,70,.55), 0 4px 30px rgba(0,0,0,.4); }
      .strike { position: relative; --cut: 0; }
      .strike::after { content: ""; position: absolute; right: -6px; top: 54%; height: 12px; border-radius: 6px; background: var(--gold2);
                       width: calc((100% + 12px) * var(--cut)); }
      .sun .inner { position: relative; }
      .sun .inner::before { content: ""; position: absolute; inset: -160px -120px; z-index: -1; background: radial-gradient(closest-side, rgba(30,14,40,.62), rgba(30,14,40,0)); }
      .sun .line { text-shadow: 0 4px 34px rgba(60,20,10,.7); }
      .sun .gold { color: #ffd98a; text-shadow: 0 0 30px rgba(120,40,0,.6), 0 4px 24px rgba(60,20,10,.8); }
      #brand { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font-size: 44px; letter-spacing: 6px; opacity: 0; color: #fff8e8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div class="layer" id="sky-night"></div>
      <div class="layer" id="sky-dawn"></div>
      <div class="layer" id="sky-sun"></div>
      <div class="layer" id="stars">{{STARS}}</div>
      <div id="rays"></div>
      <div id="sun"></div>
      <svg id="hills" viewBox="0 0 1160 520" preserveAspectRatio="none">
        <path d="M0 210 C 180 120 330 170 470 140 C 640 100 760 190 900 150 C 1010 120 1100 150 1160 130 L1160 520 L0 520 Z" fill="#120c24"/>
        <path d="M0 290 C 160 230 300 280 460 250 C 620 220 780 300 940 260 C 1050 235 1110 250 1160 240 L1160 520 L0 520 Z" fill="#07050f"/>
      </svg>
      <div class="layer" id="embers">{{EMBERS}}</div>
      <div class="layer" id="vignette"></div>
      {{CLIPS}}
      <audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="{{DUR}}" data-track-index="5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // world: night -> dawn -> sunrise
      tl.fromTo("#stars", { opacity: 0, rotation: -2 }, { opacity: 1, rotation: 4, duration: 59.5, ease: "none" }, 0);
      tl.to("#stars", { opacity: 0, duration: 8, ease: "sine.inOut" }, 38);
      tl.to("#sky-dawn", { opacity: 1, duration: 9, ease: "sine.inOut" }, 33);
      tl.to("#sky-sun", { opacity: 1, duration: 7, ease: "sine.inOut" }, 46);
      tl.fromTo("#sun", { y: 260, scale: 0.8 }, { y: 60, scale: 0.9, duration: 18, ease: "sine.inOut" }, 33);
      tl.to("#sun", { y: -230, scale: 1.15, duration: 8, ease: "power2.out" }, 51.6);
      tl.fromTo("#rays", { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 14, duration: 8, ease: "sine.out" }, 51.6);
      tl.fromTo("#hills", { y: 0 }, { y: 30, duration: 59.5, ease: "none" }, 0);
      // flashes of light on "אבל קמתם"
      tl.fromTo("#vignette", { opacity: 1 }, { opacity: 0.55, duration: 0.6, yoyo: true, repeat: 1 }, 16.6);
      tl.fromTo("#vignette", { opacity: 1 }, { opacity: 0.55, duration: 0.6, yoyo: true, repeat: 1, immediateRender: false }, 21.8);
      {{TL}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
